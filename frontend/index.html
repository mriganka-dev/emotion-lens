<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/hero-landscape.jpg" type="image/jpeg" fetchpriority="high" />
    <meta
      name="description"
      content="Emotion Lens reads facial expressions from photos and shows emotion predictions."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090a0f" />
    <title>Emotion Lens</title>
    <script>
      try {
        const theme = localStorage.getItem("emotion-lens-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || ((!theme || theme === "system") && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
